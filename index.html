<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d0d1a'/><rect x='14.5' y='3' width='3' height='18' rx='1.5' fill='%23a78bfa'/><rect x='8' y='14' width='16' height='2.5' rx='1.25' fill='%23a78bfa'/><circle cx='16' cy='26' r='3.5' fill='%23f5c518'/><rect x='15.5' y='3.5' width='1' height='16' rx='.5' fill='rgba(255,255,255,.28)'/></svg>">
  <title>DankQuest ⚔️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-logo">⚔️ DankQuest</div>
      <div class="header-right">
        <div class="streak-pill">
          <span>🔥</span>
          <span id="streak-num">0</span>
        </div>
        <div class="level-pill" id="level-pill">Lvl 1</div>
      </div>
    </header>

    <div class="xp-track">
      <div class="xp-fill" id="xp-fill"></div>
      <div class="xp-text" id="xp-text">0 XP • Wanderer</div>
    </div>

    <main id="view" class="view"></main>

    <nav class="bottom-nav">
      <div class="sidebar-brand">⚔️ DankQuest</div>
      <button class="nav-item active" onclick="showView('today')" data-v="today">
        <span>🏠</span><span>Today</span>
      </button>
      <button class="nav-item" onclick="showView('quests')" data-v="quests">
        <span>📜</span><span>Quests</span>
      </button>
      <button class="nav-item" onclick="showView('stats')" data-v="stats">
        <span>🏆</span><span>Stats</span>
      </button>
    </nav>

    <aside id="side-panel" class="side-panel"></aside>
  </div>

  <!-- Focus Mode Overlay -->
  <div id="focus-overlay" class="focus-overlay hidden">
    <div class="focus-inner">
      <div class="focus-label">⚔️ FOCUS MODE</div>
      <div class="focus-task-name" id="focus-task-name"></div>
      <div class="focus-step" id="focus-step-text"></div>
      <button class="focus-done-btn" onclick="completeFocusStep()">✓ Done — Next Step</button>
      <button class="focus-exit-btn" onclick="exitFocus()">Exit Focus</button>
    </div>
  </div>

  <!-- Add Quest Modal -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="handleOverlayClick(event)">
    <div class="modal" id="modal"></div>
  </div>

  <!-- Uncheck Confirm Dialog -->
  <div id="uncheck-overlay" class="uncheck-overlay hidden" onclick="handleUncheckOverlayClick(event)">
    <div class="uncheck-dialog">
      <div class="uncheck-title">⚠️ Uncheck Step?</div>
      <div class="uncheck-body" id="uncheck-body"></div>
      <div class="uncheck-actions">
        <button class="btn-cancel" onclick="dismissUncheck()">Cancel</button>
        <button class="btn-uncheck-confirm" onclick="proceedUncheck()">Lose the XP</button>
      </div>
    </div>
  </div>

  <!-- Level Down Overlay -->
  <div id="leveldown-overlay" class="leveldown-overlay hidden">
    <div class="leveldown-inner">
      <div class="leveldown-emoji" id="leveldown-icon">💀</div>
      <div class="leveldown-title">LEVEL DOWN</div>
      <div class="leveldown-sub" id="leveldown-sub"></div>
      <button onclick="dismissLevelDown()">Face the Shame</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Level Up Overlay -->
  <div id="levelup-overlay" class="levelup-overlay hidden">
    <div class="levelup-inner">
      <div class="levelup-emoji" id="levelup-icon">⚔️</div>
      <div class="levelup-title">LEVEL UP!</div>
      <div class="levelup-sub" id="levelup-sub"></div>
      <button onclick="dismissLevelUp()">Continue Quest</button>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="app.js"></script>
</body>
</html>
